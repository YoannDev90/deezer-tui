# Project tooling — `mise install`.
# pre-commit is pinned: everyone gets the exact same version.
#
# Rust itself is NOT managed here: rustup owns the toolchains (MSRV 1.90.0,
# same pin as .github/actions/setup-rust). A second toolchain from mise would
# shadow the rustup shims and drift from CI.

[tools]
pre-commit = "4.6.2"

[env]
# openssl-sys 0.9.112 is incompatible with the system OpenSSL 4.x headers/libs.
# Point builds (and rust-analyzer, when using mise env) at the distro's OpenSSL 3.
PKG_CONFIG_PATH = "/usr/lib/openssl-3/pkgconfig"
OPENSSL_LIB_DIR = "/usr/lib/openssl-3"
OPENSSL_INCLUDE_DIR = "/usr/include/openssl-3"

[tasks.build]
description = "Build the binary in debug mode"
run = "cargo build"

[tasks.check]
description = "Type-check the workspace"
run = "cargo check"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.fmt]
description = "Format code with rustfmt"
run = "cargo fmt"

[tasks.clippy]
description = "Run clippy with the CI gate"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.lint]
description = "What CI enforces: formatting + clippy"
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"

[tasks.run]
description = "Run the TUI application"
run = "cargo run"

[tasks.install]
description = "Install the binary to PATH"
run = "cargo install --path crates/deezer-tui"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.setup-hooks]
description = "Install git hooks (pre-commit + commit-msg)"
run = "pre-commit install && pre-commit install --hook-type commit-msg"

[hooks]
postinstall = "mise setup-hooks"
